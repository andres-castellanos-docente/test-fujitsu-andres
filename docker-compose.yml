services:
  backend:
    build: ./backend
    container_name: event-processor-backend
    ports:
      - "8080:8080"
    environment:
      CORS_ALLOWED_ORIGINS: http://localhost:4200
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  frontend:
    build: ./frontend
    container_name: event-processor-frontend
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy
