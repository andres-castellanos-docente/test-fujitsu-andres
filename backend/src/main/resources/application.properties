spring.application.name=event-processor
server.port=8080

# Banco H2 em memória (dados são perdidos ao reiniciar)
spring.datasource.url=jdbc:h2:mem:eventsdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# CORS (o frontend em Docker usa proxy do Nginx e não depende disto)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Logs: inclui o correlationId de cada requisição
logging.pattern.level=%5p [%X{correlationId:-}]
logging.level.com.fujitsu.eventprocessor=INFO

# Observabilidade
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=Event Processor API
info.app.version=1.0.0

# Documentação OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
